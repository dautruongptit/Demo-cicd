spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 1234567890
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ── Actuator dev: mở full ───────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"        # mở tất cả endpoint khi dev
  endpoint:
    health:
      show-details: always  # xem chi tiết DB, disk...

# ── Logging dev: verbose ────────────────────
logging:
  file:
    name: logs/demo-app-dev.log   # ghi vào thư mục local khi dev
  level:
    root: INFO
    com.demo.app: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # xem giá trị params
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG