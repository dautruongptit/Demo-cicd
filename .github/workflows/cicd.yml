name: CI/CD Pipeline — demo-app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/demo-cicd

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests

      - name: Test
        run: mvn test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

      - name: Notify — Build Failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *BUILD THẤT BẠI*
            📦 `${{ github.repository }}`
            🌿 `${{ github.ref_name }}`
            👤 ${{ github.actor }}
            💬 ${{ github.event.head_commit.message }}
            🔗 [Xem log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notify — Docker Failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *DOCKER PUSH THẤT BẠI*
            📦 `${{ github.repository }}`
            👤 ${{ github.actor }}
            🔗 [Xem log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    name: Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify — Bắt đầu deploy
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *ĐANG DEPLOY...*
            📦 `${{ github.repository }}`
            🏷️ `${{ env.IMAGE_NAME }}:${{ github.sha }}`
            👤 ${{ github.actor }}
            💬 ${{ github.event.head_commit.message }}

      - name: Tạo .env trên server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p ~/apps/demo-cicd
            cat > ~/apps/demo-cicd/.env << EOF
            SPRING_PROFILES_ACTIVE=prod
            JPA_DDL_AUTO=update
            TZ=Asia/Ho_Chi_Minh
            MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
            MYSQL_DATABASE=demo_db
            SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
            SPRING_DATASOURCE_USERNAME=root
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/demo-cicd
            EOF
            chmod 600 ~/apps/demo-cicd/.env

      - name: SSH Deploy & Auto Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GITHUB_SHA,IMAGE_NAME
          script: |
            set -e
            cd ~/apps/demo-cicd

            echo "📌 Lưu image hiện tại..."
            CURRENT_IMAGE=$(docker inspect demo-cicd \
              --format='{{.Config.Image}}' 2>/dev/null || echo "none")
            echo "Current: $CURRENT_IMAGE"

            echo "📥 Pull image mới: $IMAGE_NAME:$GITHUB_SHA"
            docker pull "$IMAGE_NAME:$GITHUB_SHA"

            echo "🔄 Cập nhật IMAGE_NAME trong .env..."
            sed -i "s|IMAGE_NAME=.*|IMAGE_NAME=$IMAGE_NAME:$GITHUB_SHA|g" .env

            echo "🚀 Khởi động..."
            docker-compose up -d demo-cicd

            echo "⏳ Chờ 30s..."
            sleep 30

            echo "🏥 Health check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/actuator/health || echo "000")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Health check thất bại — ROLLBACK về $CURRENT_IMAGE"
              if [ "$CURRENT_IMAGE" != "none" ]; then
                sed -i "s|IMAGE_NAME=.*|IMAGE_NAME=$CURRENT_IMAGE|g" .env
                docker-compose up -d demo-cicd
                echo "⏮️ Rollback thành công"
                exit 2
              else
                echo "⚠️ Không có image cũ"
                exit 1
              fi
            fi

            echo "🧹 Dọn image cũ..."
            docker image prune -f
            echo "✅ Deploy xong: $(date)"

      - name: Notify — Deploy thành công
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *DEPLOY THÀNH CÔNG*
            📦 `${{ github.repository }}`
            🌿 `${{ github.ref_name }}`
            🏷️ `${{ env.IMAGE_NAME }}:${{ github.sha }}`
            👤 ${{ github.actor }}
            💬 ${{ github.event.head_commit.message }}
            🔗 [Xem Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify — Deploy thất bại / Rollback
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ⚠️ *DEPLOY THẤT BẠI — ĐÃ ROLLBACK*
            📦 `${{ github.repository }}`
            🌿 `${{ github.ref_name }}`
            👤 ${{ github.actor }}
            💬 ${{ github.event.head_commit.message }}
            🔁 Hệ thống đã rollback về image trước đó
            🔗 [Xem log lỗi](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})